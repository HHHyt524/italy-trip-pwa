<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#D9622E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="意大利旅行">
<meta name="application-name" content="意大利旅行工作台">
<meta name="description" content="6人同行意大利12日深度游，协同攻略、地图路线、记账分账">
<title>意大利旅行工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta property="og:title" content="意大利旅行工作台">
<meta property="og:description" content="6人同行意大利12日深度游，协同攻略、地图路线、记账分账">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== Design System ===== */
:root {
  --c-primary: #D9622E; --c-primary-light: #F4DCC8;
  --c-secondary: #2E7D8F; --c-secondary-light: #C9E5EB;
  --c-accent: #C5283D; --c-success: #4A9D5B; --c-warning: #E8A92E;
  --c-purple: #7B5EA7; --c-bg: #FAF7F2; --c-surface: #FFFFFF;
  --c-surface-alt: #F5F0E8; --c-border: #E5DDD0;
  --c-text: #2D2424; --c-text-secondary: #7A6E62; --c-text-light: #A89B8C;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06); --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.1); --radius: 14px; --radius-sm: 8px;
  --sidebar-w: 230px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.6;font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh;max-width:100vw;overflow-x:hidden}
.hamburger{display:none;position:fixed;top:14px;left:14px;z-index:200;width:40px;height:40px;border-radius:10px;border:none;background:var(--c-surface);box-shadow:var(--shadow-md);font-size:20px;cursor:pointer;align-items:center;justify-content:center;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99;}

/* Sidebar */
.sidebar{width:var(--sidebar-w);background:var(--c-surface);border-right:1px solid var(--c-border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100;transition:transform .3s;}
.sidebar-header{padding:20px 18px 16px;border-bottom:1px solid var(--c-border)}
.sidebar-header .trip-title{font-size:18px;font-weight:700;color:var(--c-text);display:flex;align-items:center;gap:8px}
.sidebar-header .trip-sub{font-size:12px;color:var(--c-text-secondary);margin-top:4px}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;color:var(--c-text-secondary);font-size:14px;font-weight:500;transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:var(--c-surface-alt);color:var(--c-text)}
.nav-item.active{background:var(--c-primary);color:#fff}
.nav-item .icon{font-size:18px;width:22px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--c-accent);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600}
.nav-item.active .badge{background:rgba(255,255,255,.3)}

.sidebar-footer{padding:14px 16px;border-top:1px solid var(--c-border);position:relative}
.current-user{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--c-surface-alt);cursor:pointer;transition:all .15s}
.current-user:hover{background:var(--c-primary-light)}
.current-user .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.current-user .user-info{flex:1;min-width:0}
.current-user .user-name{font-size:13px;font-weight:600}
.current-user .user-responsibility{font-size:11px;color:var(--c-text-secondary)}
.current-user .switch-icon{font-size:12px;color:var(--c-text-light)}
.user-dropdown{position:absolute;bottom:100%;left:16px;right:16px;margin-bottom:8px;background:var(--c-surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);border:1px solid var(--c-border);padding:6px;display:none;z-index:200;max-height:300px;overflow-y:auto}
.user-dropdown.show{display:block}
.user-option{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s}
.user-option:hover{background:var(--c-surface-alt)}
.user-option .avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.user-option .uo-name{font-size:13px;font-weight:600}
.user-option .uo-desc{font-size:11px;color:var(--c-text-secondary)}

/* ===== Main ===== */
.main{flex:1;margin-left:var(--sidebar-w);min-width:0}
.main-header{background:var(--c-surface);border-bottom:1px solid var(--c-border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.main-header h1{font-size:20px;font-weight:700}
.main-header .header-desc{font-size:13px;color:var(--c-text-secondary);margin-top:2px}
.content{padding:24px 28px;max-width:1300px}

/* ===== Cards ===== */
.card{background:var(--c-surface);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--c-border);padding:20px}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid-6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.stat-card{background:var(--c-surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--c-border);display:flex;align-items:center;gap:14px}
.stat-card .stat-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.stat-card .stat-value{font-size:24px;font-weight:700;line-height:1.2}
.stat-card .stat-label{font-size:12px;color:var(--c-text-secondary)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--c-border);color:var(--c-text)}
.btn-outline:hover{border-color:var(--c-primary);color:var(--c-primary)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}

.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tag-rome{background:#FDE8E0;color:#C5283D}.tag-naples{background:#DBEAFE;color:#2563EB}
.tag-tuscany{background:#DCFCE7;color:#16A34A}.tag-florence{background:#F3E8FF;color:#7B5EA7}
.tag-sorrento{background:#C9E5EB;color:#2E7D8F}.tag-vatican{background:#FEF3C7;color:#D97706}

/* ===== Itinerary ===== */
.day-card{background:var(--c-surface);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--c-border);margin-bottom:14px;overflow:hidden}
.day-card:hover{box-shadow:var(--shadow-md)}
.day-header{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none;transition:background .15s}
.day-header:hover{background:var(--c-surface-alt)}
.day-number{width:44px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;color:#fff}
.day-number .dn{font-size:18px;line-height:1}.day-number .dl{font-size:9px;opacity:.85}
.day-info{flex:1;min-width:0}
.day-info .day-city{font-size:16px;font-weight:700}
.day-info .day-meta{font-size:12px;color:var(--c-text-secondary);display:flex;gap:12px;flex-wrap:wrap}
.day-toggle{font-size:14px;color:var(--c-text-light);transition:transform .2s}
.day-card.expanded .day-toggle{transform:rotate(180deg)}
.day-body{display:none;padding:0 20px 16px}
.day-card.expanded .day-body{display:block}

.day-section-label{font-size:12px;font-weight:600;color:var(--c-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;display:flex;align-items:center;gap:6px}

/* Inline editable */
.inline-edit{cursor:pointer;padding:2px 4px;border-radius:4px;transition:background .15s;border-bottom:1px dashed transparent}
.inline-edit:hover{background:var(--c-primary-light);border-bottom-color:var(--c-primary)}
.inline-edit input,.inline-edit textarea{width:100%;padding:6px 8px;border:1.5px solid var(--c-primary);border-radius:4px;font-size:13px;font-family:inherit;background:var(--c-surface);outline:none}

/* Timeline */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--c-border)}
.timeline-item{position:relative;margin-bottom:12px;padding:10px 14px;background:var(--c-surface-alt);border-radius:var(--radius-sm);transition:all .15s}
.timeline-item:hover{background:var(--c-primary-light)}
.timeline-item::before{content:'';position:absolute;left:-21px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--c-primary);border:2px solid var(--c-surface)}
.timeline-time{font-size:12px;font-weight:700;color:var(--c-primary)}
.timeline-title{font-size:14px;font-weight:600;margin-top:2px}
.timeline-desc{font-size:12px;color:var(--c-text-secondary);margin-top:3px}
.timeline-location{font-size:11px;color:var(--c-secondary);margin-top:2px;display:flex;align-items:center;gap:3px}
.timeline-actions{display:flex;gap:6px;margin-top:6px}
.timeline-item .timeline-actions{opacity:0;transition:opacity .15s}
.timeline-item:hover .timeline-actions{opacity:1}

.info-row{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--c-border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-row .info-label{font-weight:600;color:var(--c-text-secondary);width:60px;flex-shrink:0}
.info-row .info-value{flex:1;word-break:break-word}

/* ===== Map ===== */
#map-container{height:600px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--c-border)}
.map-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.day-filter{display:flex;gap:6px;flex-wrap:wrap}
.day-filter-btn{padding:5px 12px;border-radius:20px;border:1.5px solid var(--c-border);background:var(--c-surface);cursor:pointer;font-size:12px;font-weight:600;color:var(--c-text-secondary);transition:all .15s;font-family:inherit}
.day-filter-btn:hover,.day-filter-btn.active{border-color:var(--c-primary);background:var(--c-primary);color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px}
.legend-dot{width:12px;height:12px;border-radius:50%}

/* ===== Tasks ===== */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kanban-col{background:var(--c-surface-alt);border-radius:var(--radius);padding:14px;min-height:200px}
.kanban-col-header{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:.5px}
.kanban-col-header .count{background:var(--c-surface);padding:1px 8px;border-radius:10px;font-size:11px}
.task-card{background:var(--c-surface);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;box-shadow:var(--shadow-sm);cursor:grab;border-left:3px solid var(--c-primary);transition:all .15s}
.task-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.task-card .tc-title{font-size:13px;font-weight:600;margin-bottom:4px}
.task-card .tc-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--c-text-secondary)}
.task-card .tc-assignee{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.task-card .tc-due.urgent{color:var(--c-accent);font-weight:700}
.priority-dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ===== Expenses ===== */
.expense-table{width:100%;border-collapse:collapse}
.expense-table th{text-align:left;padding:10px 12px;font-size:12px;font-weight:700;color:var(--c-text-secondary);border-bottom:2px solid var(--c-border);text-transform:uppercase;letter-spacing:.5px}
.expense-table td{padding:10px 12px;border-bottom:1px solid var(--c-border);font-size:13px}
.expense-table tr:hover td{background:var(--c-surface-alt)}
.expense-table .amt{font-weight:700;font-family:'Consolas',monospace}
.expense-table .amt-eur{color:var(--c-secondary)}
.expense-table .amt-cny{color:var(--c-primary)}
.shared-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.shared-badge.public{background:#DCFCE7;color:#16A34A}
.shared-badge.private{background:#FEF3C7;color:#D97706}

.expense-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.summary-box{background:linear-gradient(135deg,#fff 0%,var(--c-surface-alt) 100%);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow-sm);border:1px solid var(--c-border);display:flex;align-items:center;gap:14px;transition:all .2s}
.summary-box:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.summary-box .sb-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.summary-box .sb-content{flex:1}
.summary-box .sb-value{font-size:26px;font-weight:800;line-height:1.1}
.summary-box .sb-label{font-size:12px;color:var(--c-text-secondary);margin-top:2px}
.summary-box .sb-sub{font-size:11px;color:var(--c-text-light);margin-top:2px}

.per-person-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:14px}
.per-person-card{background:var(--c-surface);border-radius:var(--radius);padding:16px 12px;box-shadow:var(--shadow-sm);border:1px solid var(--c-border);text-align:center;position:relative;transition:all .2s}
.per-person-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.per-person-card.current{border:2px solid var(--c-primary);background:linear-gradient(180deg,#fff 0%,var(--c-surface-alt) 100%)}
.per-person-card .pp-avatar{width:48px;height:48px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--c-surface-alt);overflow:hidden}
.per-person-card .pp-avatar .member-avatar-img{width:100% !important;height:100% !important}
.per-person-card .pp-name{font-size:14px;font-weight:700;margin-bottom:12px}
.per-person-card .pp-row{display:flex;justify-content:center;gap:6px;align-items:center;font-size:12px;margin-bottom:6px}
.per-person-card .pp-row .pp-label{color:var(--c-text-light)}
.per-person-card .pp-row .pp-value{font-weight:700}
.per-person-card .pp-aa .pp-value{color:#16A34A}
.per-person-card .pp-personal .pp-value{color:#D97706}
.per-person-card .pp-total{font-size:22px;font-weight:800;margin-top:12px;padding-top:10px;border-top:1px dashed var(--c-border)}
.per-person-card .pp-share{height:4px;border-radius:2px;background:var(--c-surface-alt);margin-top:10px;overflow:hidden}
.per-person-card .pp-share-fill{height:100%;border-radius:2px}

.category-bar{height:8px;border-radius:4px;background:var(--c-surface-alt);overflow:hidden;margin-top:6px}
.category-bar-fill{height:100%;border-radius:4px;transition:width .5s}

/* ===== Members ===== */
.member-card{background:var(--c-surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--c-border);text-align:center;cursor:pointer;transition:all .15s;position:relative}
.member-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.member-card.current{border:2px solid var(--c-primary)}
.member-card .mc-avatar{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px}
.member-card .mc-name{font-size:15px;font-weight:700}
.member-card .mc-duty{font-size:11px;color:var(--c-text-secondary);margin-top:2px;line-height:1.4}
.member-card .mc-badge{position:absolute;top:10px;right:10px;background:var(--c-success);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}

/* ===== Activity Feed ===== */
.activity-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--c-border)}
.activity-item:last-child{border-bottom:none}
.activity-item .ai-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.activity-item .ai-content{flex:1;font-size:13px}
.activity-item .ai-time{font-size:11px;color:var(--c-text-light)}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--c-surface);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);transform:scale(.95);transition:transform .2s}
.modal-overlay.show .modal{transform:scale(1)}
.modal h3{font-size:18px;font-weight:700;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--c-text-secondary);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1.5px solid var(--c-border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--c-surface);color:var(--c-text);transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--c-primary)}
.form-group textarea{resize:vertical;min-height:70px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* Location search dropdown */
.location-search{position:relative}
.location-suggestions{position:absolute;top:100%;left:0;right:0;background:var(--c-surface);border:1.5px solid var(--c-border);border-radius:var(--radius-sm);max-height:180px;overflow-y:auto;z-index:10;display:none;box-shadow:var(--shadow-md)}
.location-suggestions.show{display:block}
.location-suggestion{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--c-border)}
.location-suggestion:last-child{border-bottom:none}
.location-suggestion:hover{background:var(--c-primary-light)}
.location-suggestion .ls-name{font-weight:600}
.location-suggestion .ls-city{font-size:11px;color:var(--c-text-secondary)}

/* ===== Toast ===== */
.toast{position:fixed;bottom:24px;right:24px;background:var(--c-text);color:#fff;padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:2000;transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}

.empty-state{text-align:center;padding:40px 20px;color:var(--c-text-light)}
.empty-state .es-icon{font-size:48px;margin-bottom:10px}

.leaflet-popup-content{font-size:13px}
.leaflet-popup-content strong{color:var(--c-primary)}
.section-gap{margin-bottom:24px}
.hero-countdown-inline{display:none}
.member-avatar-img{width:1.6em;height:1.6em;border-radius:50%;object-fit:cover;display:inline-block;vertical-align:middle}
.mc-avatar .member-avatar-img,.avatar .member-avatar-img,.ai-avatar .member-avatar-img,#cu-avatar .member-avatar-img{width:100% !important;height:100% !important}

/* ===== Mobile ===== */
@media(max-width:768px){
  .hamburger{display:flex}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.active{display:block}
  .main{margin-left:0;max-width:100vw;overflow-x:hidden}
  .main-header{padding:14px 18px 14px 66px}
  .main-header h1{font-size:17px}
  .content{padding:16px 14px;max-width:100vw}

/* ================================================================
   IMAGE STORE: IndexedDB (stores images as base64, avoids localStorage limits)
   ================================================================ */
const imgDB = (() => {
  let db = null;
  const DB_NAME = 'italy-trip-images', STORE = 'images', V = 1;
  function open() {
    return new Promise((resolve, reject) => {
      if (db) return resolve(db);
      const req = indexedDB.open(DB_NAME, V);
      req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains(STORE)) e.target.result.createObjectStore(STORE); };
      req.onsuccess = e => { db = e.target.result; resolve(db); };
      req.onerror = () => reject(req.error);
    });
  }
  async function save(key, b64) { const d = await open(); return new Promise((r, e) => { const t = d.transaction(STORE, 'readwrite').objectStore(STORE).put(b64, key); t.onsuccess = () => r(key); t.onerror = () => e(t.error); }); }
  async function load(key) { const d = await open(); return new Promise((r, e) => { const t = d.transaction(STORE).objectStore(STORE).get(key); t.onsuccess = () => r(t.result); t.onerror = () => e(t.error); }); }
  async function remove(key) { const d = await open(); return new Promise((r, e) => { const t = d.transaction(STORE, 'readwrite').objectStore(STORE).delete(key); t.onsuccess = () => r(); t.onerror = () => e(t.error); }); }
  return { save, load, remove };
})();

// —— Day 10 & 11 (10月5-6日) 行程迁移 ——
// 签名检测式迁移：无论数据来自 localStorage 还是 Supabase 实时同步，
// 只要检测到不是最新版行程（缺少特征活动），就自动用 INITIAL_ITINERARY 覆盖修复。
// 已迁移的数据（含特征活动）不会被覆盖，用户后续编辑得以保留。
function isD10D11Stale(it) {
  if (!it || !it[9] || !it[10]) return false;
  const a = it[9].activities || [];
  const b = it[10].activities || [];
  const sig10 = a.some(x => x.title === '教堂大殿（免费）' && x.timeStart === '10:15');
  const sig11 = b.some(x => x.title === '乌菲兹美术馆（3小时）' && x.timeStart === '10:45');
  return !(sig10 && sig11);
}
function migrateItineraryD10D11() {
  if (!state.itinerary || state.itinerary.length < 11) return false;
  if (!isD10D11Stale(state.itinerary)) return false;
  state.itinerary[9] = JSON.parse(JSON.stringify(INITIAL_ITINERARY[9]));
  state.itinerary[10] = JSON.parse(JSON.stringify(INITIAL_ITINERARY[10]));
  return true;
}
function persistState() {
  try { localStorage.setItem('italy-trip-v2', JSON.stringify({
    tasks: state.tasks, expenses: state.expenses, packing: state.packing, activities: state.activities,
    itinerary: state.itinerary, currentUser: state.currentUser,
    expandedDays: [...state.expandedDays], currentView: state.currentView,
    activityFilter: state.activityFilter,
  })); } catch(e) {}
}

function saveState() {
  try {
    const d = {
      tasks: state.tasks, expenses: state.expenses, packing: state.packing, activities: state.activities,
      itinerary: state.itinerary, currentUser: state.currentUser,
      expandedDays: [...state.expandedDays], currentView: state.currentView,
      activityFilter: state.activityFilter,
    };
    localStorage.setItem('italy-trip-v2', JSON.stringify(d));
    // Push to Supabase
    pushToSupabase();
  } catch(e) {}
}
function loadState() {
  try {
    const s = localStorage.getItem('italy-trip-v2');
    if (s) {
      const d = JSON.parse(s);
      // Only overwrite if saved arrays actually have content; otherwise keep INITIAL_* defaults
      if (d.tasks && d.tasks.length) state.tasks = d.tasks;
      if (d.expenses && d.expenses.length) state.expenses = d.expenses;
      if (d.packing && d.packing.length) state.packing = d.packing;
      if (d.activities && d.activities.length) state.activities = d.activities;
      if (d.itinerary && d.itinerary.length) state.itinerary = d.itinerary;
      // Keep structural city names in sync with code defaults (preserve user edits to activities/notes)
      state.itinerary.forEach((day, i) => {
        if (INITIAL_ITINERARY[i] && INITIAL_ITINERARY[i].city) {
          day.city = INITIAL_ITINERARY[i].city;
        }
      });
      // Migration: force-update Day 10 & 11 itinerary (Oct 5-6 Florence/Rome revised schedule)
      // Signature-based: re-runs whenever stale data is detected (localStorage / Supabase / realtime)
      const migratedD10D11 = migrateItineraryD10D11();
      if (migratedD10D11) {
        persistState();
        // Push corrected itinerary to Supabase so other devices / realtime get fixed too
        try { pushToSupabase(); } catch(e) {}
      }
      if (d.currentUser) state.currentUser = d.currentUser;
      if (d.expandedDays) state.expandedDays = new Set(d.expandedDays);
      if (d.activityFilter) state.activityFilter = d.activityFilter;
    }
  } catch(e) {
    console.log('loadState error', e);
  }
}

function fmtTimeAgo(ts) { const diff=Date.now()-ts; if(diff<6e4)return'刚刚';if(diff<36e5)return Math.floor(diff/6e4)+'分钟前';if(diff<864e5)return Math.floor(diff/36e5)+'小时前';return Math.floor(diff/864e5)+'天前' }

function weatherIcon(code) {
  if (code === 0) return '☀️';
  if ([1,2,3].includes(code)) return '⛅';
  if ([45,48].includes(code)) return '🌫️';
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return '🌧️';
  if ([71,73,75,77,85,86].includes(code)) return '❄️';

  return '☁️';
}
async function fetchItineraryWeather() {
  if (weatherLoading) return;
  weatherLoading = true;
  const days = state.itinerary
    .map(d => ({ date: d.date, city: d.city.replace(/（返程）/g, '').replace(/→.*$/g, '').replace(/\+.*$/g, '') }))
    .filter((d, i, arr) => arr.findIndex(x => x.date === d.date && x.city === d.city) === i);
  const results = [];
  for (const day of days) {
    const loc = WEATHER_CITIES[day.city] || WEATHER_CITIES['罗马'];
    try {
      const resp = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe/Rome&forecast_days=16&start_date=${day.date}&end_date=${day.date}`);
      const data = await resp.json();
      if (data.daily && data.daily.time && data.daily.time.length > 0) {
        results.push({
          date: day.date,
          city: day.city,
          max: Math.round(data.daily.temperature_2m_max[0]),
          min: Math.round(data.daily.temperature_2m_min[0]),
          code: data.daily.weathercode[0]
        });
      }
    } catch(e) {}
  }
  weatherCache = results;
  weatherLoading = false;
  const el = document.getElementById('content');
  if (el && state.currentView === 'dashboard') renderDashboard(el);
}

function lookupLocation(name) { if(!name) return null; const l=LOCATION_DB.find(x=>x.name===name); if(l) return l; const q=name.toLowerCase(); return LOCATION_DB.find(x=>x.name.toLowerCase().includes(q)||q.includes(x.name.toLowerCase()))||null }

function renderItinerary(el) {
  el.innerHTML=`
    <div style="margin-bottom:16px;display:flex;gap:10px;">

function renderDayCard(day) {

  return `<div class="day-card ${exp?'expanded':''}" id="day-${day.id}">
    <div class="day-header" onclick="toggleDay(${day.id})">
      <div class="day-number" style="background:${ci.color};"><div class="dn">D${day.id}</div><div class="dl">${day.dow}</div></div>
      <div class="day-info">
        <div class="day-city">${day.city} <span class="tag ${ci.tag}" style="margin-left:6px;">${fmtDate(day.date)}</span>${day.notes?`<span style="font-size:11px;margin-left:6px;color:#E07B3C;" title="有提醒">⚠️</span>`:''}${day.memo?`<span style="font-size:11px;margin-left:4px;color:#D97706;" title="有备注">📝</span>`:''}</div>
        <div class="day-meta">
          <span>🚗 <span class="inline-edit" onclick="event.stopPropagation();editDayField(${day.id},'transport')" title="点击编辑">${esc(day.transport||'—')}</span></span>
          <span>🏨 <span class="inline-edit" onclick="event.stopPropagation();editDayField(${day.id},'accommodation')" title="点击编辑">${esc((day.accommodation||'—').substring(0,30))}${(day.accommodation||'').length>30?'…':''}</span></span>
          <span>📍 ${day.activities.length}个活动</span>
        </div>
      </div>
      <span class="day-toggle">▼</span>
    </div>
    <div class="day-body">
      ${day.notes?`<div style="background:#FEF3C7;border-radius:8px;padding:10px 14px;font-size:12px;color:#92400E;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;"><span>⚠️ 提醒：<span class="inline-edit" onclick="editDayField(${day.id},'notes')" style="font-size:13px;">${esc(day.notes)}</span></span><button class="btn btn-outline btn-sm" style="padding:2px 6px;font-size:11px;" onclick="event.stopPropagation();editDayField(${day.id},'notes')">编辑</button></div>`:'<div style="margin-bottom:10px;padding:8px 12px;background:var(--c-surface-alt);border-radius:8px;border:1px dashed var(--c-border);"><span class="inline-edit" style="font-size:12px;color:var(--c-primary);cursor:pointer;" onclick="editDayField(${day.id},&#39;notes&#39;)">+ 添加提醒</span></div>'}
      ${day.memo?`<div style="background:#EFF6FF;border-radius:8px;padding:10px 14px;font-size:12px;color:#1E40AF;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;"><span>📝 备注：<span class="inline-edit" onclick="editDayField(${day.id},'memo')" style="font-size:13px;">${esc(day.memo)}</span></span><button class="btn btn-outline btn-sm" style="padding:2px 6px;font-size:11px;" onclick="event.stopPropagation();editDayField(${day.id},'memo')">编辑</button></div>`:'<div style="margin-bottom:12px;padding:8px 12px;background:var(--c-surface-alt);border-radius:8px;border:1px dashed var(--c-border);"><span class="inline-edit" style="font-size:12px;color:var(--c-primary);cursor:pointer;" onclick="editDayField(${day.id},&#39;memo&#39;)">+ 添加备注</span></div>'}

function renderTimelineItem(day, act, idx) {
  const loc = lookupLocation(act.locationName);
  const timeDisplay = act.timeStart === act.timeEnd ? act.timeStart : `${act.timeStart} - ${act.timeEnd}`;
  const imgs = (act.images && act.images.length > 0)
    ? `<div class="timeline-img-row">${act.images.map((imgId, i) =>
        `<img class="timeline-img" src="" data-imgid="${imgId}" data-day="${day.id}" data-idx="${idx}" data-ii="${i}"
          onclick="event.stopPropagation();openLightbox(${day.id},${idx},${i})"
          onerror="this.onerror=null;imgDB.load('${imgId}').then(function(b64){if(b64)this.src=b64}.bind(this))"
          style="background:var(--c-surface-alt);" title="点击查看大图">`
      ).join('')}</div>` : '';
  return `<div class="timeline-item" id="act-${day.id}-${idx}">
    <div class="timeline-time">${timeDisplay}</div>
    <div class="timeline-title">${esc(act.title)}</div>
    ${act.desc?`<div class="timeline-desc">${esc(act.desc)}</div>`:''}
    ${act.locationName?`<div class="timeline-location">📍 ${esc(act.locationName)}${loc?' ✅':' ⚠️未匹配'}</div>`:''}
    ${imgs}
    <div class="timeline-actions">
      <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openActivityModal(${day.id},${idx})">编辑</button>
      <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();deleteActivity(${day.id},${idx})">删除</button>
    </div>
  </div>`;
}

function editDayField(dayId, field) {
  const day = state.itinerary.find(d=>d.id===dayId);
  const oldVal = day[field] || '';
  const isNotes = field === 'notes' || field === 'memo';
  const input = isNotes ? `<textarea id="ef-input" style="width:100%;padding:8px;border:1.5px solid var(--c-primary);border-radius:4px;font-size:13px;font-family:inherit;min-height:60px;">${esc(oldVal)}</textarea>`
    : `<input id="ef-input" type="text" value="${esc(oldVal)}" style="width:100%;padding:8px;border:1.5px solid var(--c-primary);border-radius:4px;font-size:13px;font-family:inherit;">`;
  const labelMap = {transport:'交通',accommodation:'住宿',notes:'提醒',memo:'备注'};
  showModal(`<h3>编辑${labelMap[field]||'字段'}</h3>
    <div style="font-size:13px;color:var(--c-text-secondary);margin-bottom:10px;">D${dayId} · ${day.city} · ${fmtDate(day.date)}</div>
    ${input}
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveDayField(${dayId},'${field}')">保存</button></div>`);
  setTimeout(()=>document.getElementById('ef-input')?.focus(),100);
}

function saveDayField(dayId, field) {
  const day = state.itinerary.find(d=>d.id===dayId);
  const val = document.getElementById('ef-input').value.trim();
  day[field] = val;
  const labelMap2 = {transport:'交通',accommodation:'住宿',notes:'提醒',memo:'备注'};
  logActivity(`编辑了D${dayId}的${labelMap2[field]||field}`);
  saveState(); closeModal(); renderItinerary(document.getElementById('content'));
  showToast('保存成功');
}

function toggleDay(id) {
  if(state.expandedDays.has(id))state.expandedDays.delete(id);else state.expandedDays.add(id);
  saveState();renderItinerary(document.getElementById('content'));
}
function expandAllDays() { state.itinerary.forEach(d=>state.expandedDays.add(d.id));saveState();renderItinerary(document.getElementById('content')); }
function collapseAllDays() { state.expandedDays.clear();saveState();renderItinerary(document.getElementById('content')); }

        ${state.itinerary.map(d=>{
          const city=d.city.split('→')[0].split('+')[0].trim();
          return`<button class="btn btn-outline" style="justify-content:flex-start;text-align:left;padding:10px 14px;width:100%;" onclick="openActivityModal(${d.id});">D${d.id} · ${city} · ${fmtDate(d.date)}</button>`;
        }).join('')}

    <div class="img-thumb-wrap" id="img-ex-${i}">

  showModal(`<h3>${isEdit?'编辑活动':'添加活动'}</h3>

    <div style="display:flex;gap:12px;">
      <div class="form-group" style="flex:1;"><label>开始时间</label><input type="time" id="act-ts" value="${act.timeStart}" onclick="try{this.showPicker()}catch(e){}"></div>
      <div class="form-group" style="flex:1;"><label>结束时间</label><input type="time" id="act-te" value="${act.timeEnd}" onclick="try{this.showPicker()}catch(e){}"></div>
    </div>

    <div class="form-group"><label>描述/备注</label><textarea id="act-desc" placeholder="详细信息...">${esc(act.desc||'')}</textarea></div>
    <div class="form-group location-search"><label>地点名称（输入后选择匹配地点，自动标注地图）</label>
      <input type="text" id="act-loc" value="${esc(act.locationName||'')}" placeholder="如：罗马斗兽场" autocomplete="off" oninput="searchLocations()" onfocus="searchLocations()">
      <div class="location-suggestions" id="act-loc-suggestions"></div>
    </div>
    <div class="form-group"><label>📷 活动图片</label>
      <div class="img-upload-area" id="img-upload-area">
        ${existingImgs}
        ${(window._tempImages||[]).map((_,i)=>`<div class="img-thumb-wrap" id="img-tmp-${i}"><img class="img-thumb" src="${window._tempImages[i].dataUrl}"><button class="img-del" onclick="event.stopPropagation();removeTempImg('tmp',${i})">×</button></div>`).join('')}
        <button class="img-add-btn" onclick="event.preventDefault();document.getElementById('hidden-file-input').click()" title="添加图片">+</button>
      </div>
      <div style="font-size:11px;color:var(--c-text-light);margin-top:4px;">支持 JPG/PNG，单张最大 5MB</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveActivity(${dayId},${isEdit?actIdx:'-1'})">保存</button>

  // Load existing images from IndexedDB asynchronously
  if (act.images && act.images.length > 0) {

function searchLocations() {
  const q = document.getElementById('act-loc')?.value?.trim()||'';
  const dd = document.getElementById('act-loc-suggestions');
  if(!q) { dd.classList.remove('show');return }
  const results = LOCATION_DB.filter(l=>l.name.toLowerCase().includes(q.toLowerCase())).slice(0,8);
  if(results.length===0){dd.classList.remove('show');return}
  dd.innerHTML = results.map(l=>`<div class="location-suggestion" onclick="selectLocation('act-loc','${esc(l.name).replace(/'/g,"\\'")}')">
    <div class="ls-name">${l.name}</div><div class="ls-city">${l.city} · ${l.lat.toFixed(4)},${l.lng.toFixed(4)}</div>
  </div>`).join('');
  dd.classList.add('show');
  setTimeout(()=>document.addEventListener('click',function hide(e){if(!e.target.closest('.location-search')){dd.classList.remove('show');document.removeEventListener('click',hide)}},{once:true}));
}

function selectLocation(inputId, name) {
  document.getElementById(inputId).value = name;
  document.getElementById('act-loc-suggestions').classList.remove('show');
}

/* ----- 图片上传处理 ----- */
window._tempImages = [];       // [{id, dataUrl}] — pending uploads
window._removedExisting = [];  // image ids to remove on save

function handleImageFiles(input) {
  const files = input.files;
  if (!files || files.length === 0) return;
  window._tempImages = window._tempImages || [];
  let processed = 0;
  Array.from(files).forEach(file => {
    if (file.size > 5 * 1024 * 1024) { showToast('图片 ' + file.name + ' 超过5MB，已跳过'); processed++; if (processed === files.length) refreshImgSection(); return; }
    const reader = new FileReader();
    reader.onload = async function(e) {
      const imgId = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      try {
        await imgDB.save(imgId, e.target.result);
        window._tempImages.push({ id: imgId, dataUrl: e.target.result });
      } catch(err) {
        showToast('图片保存失败，请重试');
      }
      processed++;
      if (processed === files.length) refreshImgSection();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function removeTempImg(type, idx) {
  if (type === 'tmp') {
    const removed = window._tempImages.splice(idx, 1);
    if (removed.length) imgDB.remove(removed[0].id).catch(()=>{});
  } else if (type === 'ex') {
    const actId = window._editingDayId + '_' + window._editingActIdx;
    // Mark existing image for removal
    window._removedExisting = window._removedExisting || [];
    const imgArea = document.getElementById('img-upload-area');
    const wrap = document.getElementById('img-ex-' + idx);
    if (wrap) { wrap.style.display = 'none'; }
    // Store the index to filter out on save
    if (!window._removedExisting.includes(idx)) window._removedExisting.push(idx);
  }
}

function refreshImgSection() {
  const area = document.getElementById('img-upload-area');
  if (!area) return;
  const actId = window._editingDayId + '_' + window._editingActIdx;
  const day = state.itinerary.find(d => d.id === window._editingDayId);
  const act = (window._editingActIdx >= 0 && day) ? day.activities[window._editingActIdx] : {images:[]};
  const existingImgs = (act.images||[]).filter((_,i) => !(window._removedExisting||[]).includes(i));
  area.innerHTML = existingImgs.map((imgId, i) => `
    <div class="img-thumb-wrap" id="img-ex-${i}">
      <img class="img-thumb" src="" data-imgid="${imgId}" onerror="this.onerror=null;imgDB.load('${imgId}').then(function(b64){if(b64)this.src=b64}.bind(this))" style="background:var(--c-surface-alt);">
      <button class="img-del" onclick="event.stopPropagation();removeTempImg('ex',${i})">×</button>
    </div>`).join('')
    + (window._tempImages||[]).map((t,i) => `<div class="img-thumb-wrap" id="img-tmp-${i}"><img class="img-thumb" src="${t.dataUrl}"><button class="img-del" onclick="event.stopPropagation();removeTempImg('tmp',${i})">×</button></div>`).join('')
    + '<button class="img-add-btn" onclick="event.preventDefault();document.getElementById(\'hidden-file-input\').click()" title="添加图片">+</button>';
  // Re-load existing images
  existingImgs.forEach((imgId, i) => {
    imgDB.load(imgId).then(b64 => {
      const el = document.getElementById('img-ex-'+i);
      if (el) { const img = el.querySelector('img'); if (img && b64) img.src = b64; }
    }).catch(()=>{});
  });
}

// ===== SAVE ACTIVITY (with images) =====
function saveActivity(dayId, actIdx) {
  const day = state.itinerary.find(d=>d.id===dayId);
  const locName = document.getElementById('act-loc').value.trim();
  const loc = lookupLocation(locName);

  // Collect image ids: existing (minus removed) + newly uploaded
  const oldAct = actIdx>=0 ? day.activities[actIdx] : {images:[]};
  const removedSet = new Set(window._removedExisting||[]);
  const keptImages = (oldAct.images||[]).filter((_,i) => !removedSet.has(i));
  const newImages = (window._tempImages||[]).map(t => t.id);
  const allImages = [...keptImages, ...newImages];

  // Clean up removed images from IndexedDB
  (oldAct.images||[]).forEach((imgId, i) => {
    if (removedSet.has(i)) imgDB.remove(imgId).catch(()=>{});
  });

  const data = {
    timeStart: document.getElementById('act-ts').value,
    timeEnd: document.getElementById('act-te').value,
    title: document.getElementById('act-title').value.trim(),
    desc: document.getElementById('act-desc').value.trim(),
    locationName: locName,
    images: allImages,
  };
  if(!data.title){showToast('请填写活动名称');return}
  if(actIdx>=0){day.activities[actIdx]=data;logActivity(`编辑了D${dayId}的活动"${data.title}"`)}
  else{day.activities.push(data);logActivity(`在D${dayId}添加了活动"${data.title}"`)}
  day.activities.sort((a,b)=>a.timeStart.localeCompare(b.timeStart));
  // Clear temp state
  window._tempImages = []; window._removedExisting = [];
  state.expandedDays.add(dayId);saveState();closeModal();renderItinerary(document.getElementById('content'));
  updateTaskBadge();showToast('保存成功'+(data.images.length?' 📷'+data.images.length+'张图':'')+(loc?' ✅已匹配地图':' ⚠️未匹配地图'));
}
function deleteActivity(dayId, actIdx) {
  const day=state.itinerary.find(d=>d.id===dayId),a=day.activities[actIdx];
  // Clean up images from IndexedDB
  if (a.images && a.images.length) {
    a.images.forEach(imgId => imgDB.remove(imgId).catch(()=>{}));
  }
  day.activities.splice(actIdx,1);
  logActivity(`删除了D${dayId}的活动"${a.title}"`);saveState();renderItinerary(document.getElementById('content'));showToast('已删除');
}

const TASK_COLS=[{id:'todo',label:'待办',color:'#E8A92E'},{id:'doing',label:'进行中',color:'#2E7D8F'},{id:'done',label:'已完成',color:'#4A9D5B'}];

const PRIO={high:{label:'高',color:'#C5283D'},medium:{label:'中',color:'#E8A92E'},low:{label:'低',color:'#A89B8C'}};
function sortTasksByTime(a,b){
  const aHas=a.dueDate&&a.dueDate!=='',bHas=b.dueDate&&b.dueDate!=='';
  if(aHas&&!bHas)return -1;if(!aHas&&bHas)return 1;
  return aHas?new Date(a.dueDate)-new Date(b.dueDate):a.title.localeCompare(b.title);
}

function renderTasks(el) {
  el.innerHTML=TASK_CATS.map(cat=>{
    const ct=state.tasks.filter(t=>t.category===cat),dc=ct.filter(t=>t.status==='done').length;
    return`<div class="card" style="margin-bottom:16px;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;"><div style="font-size:15px;font-weight:700;">${{'抢票预订':'🎫','打包清单':'🎒','交通提醒':'🚗','美食推荐':'🍝'}[cat]} ${cat}</div><div style="font-size:12px;color:var(--c-text-secondary);">${dc}/${ct.length} 完成</div></div>
      <div class="kanban">${TASK_COLS.map(col=>{const tasks=ct.filter(t=>t.status===col.id).sort(sortTasksByTime);return`<div class="kanban-col"><div class="kanban-col-header"><span style="color:${col.color};">${col.label}</span><span class="count">${tasks.length}</span></div>${tasks.map(t=>renderTaskCard(t)).join('')||'<div style="text-align:center;padding:14px;color:var(--c-text-light);font-size:12px;">—</div>'}</div>`;}).join('')}
    </div></div>`;
  }).join('');

  document.querySelectorAll('.kanban-col').forEach(col=>{col.addEventListener('dragover',e=>e.preventDefault());col.addEventListener('drop',e=>{e.preventDefault();const tid=parseInt(e.dataTransfer.getData('taskId'));const ns=col.querySelector('.kanban-col-header span').textContent;const sm={'待办':'todo','进行中':'doing','已完成':'done'};const task=state.tasks.find(t=>t.id===tid);if(task&&task.status!==sm[ns]){task.status=sm[ns];logActivity(`将"${task.title}"标记为${ns}`);saveState();renderTasks(document.getElementById('content'));updateTaskBadge();showToast('已移至'+ns);}});});
}
function renderTaskCard(t){const m=getMember(t.assignee),p=PRIO[t.priority]||PRIO.medium,urg=t.dueDate&&(new Date(t.dueDate)-Date.now())<7*864e5&&t.status!=='done';return`<div class="task-card" draggable="true" data-task-id="${t.id}" style="border-left-color:${p.color};"><div class="tc-title">${esc(t.title)}</div>${t.desc?`<div style="font-size:11px;color:var(--c-text-secondary);margin-bottom:6px;">${esc(t.desc).substring(0,60)}${t.desc.length>60?'…':''}</div>`:''}<div class="tc-meta"><span class="tc-assignee" style="background:${m.color}20;color:${m.color};">${m.avatar} ${m.name}</span>${t.dueDate?`<span class="tc-due ${urg?'urgent':''}">📅 ${fmtDate(t.dueDate)}</span>`:''}<span style="display:flex;align-items:center;gap:3px;"><span class="priority-dot" style="background:${p.color};"></span>${p.label}</span></div><div style="display:flex;gap:6px;margin-top:8px;opacity:0;transition:opacity .15s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0"><button class="btn btn-outline btn-sm" onclick="openTaskModal(${t.id})">编辑</button><button class="btn btn-outline btn-sm" onclick="deleteTask(${t.id})">删除</button></div></div>`;}
function openTaskModal(tid){const ie=tid!==undefined;const t=ie?state.tasks.find(x=>x.id===tid):{title:'',category:'抢票预订',assignee:state.currentUser,dueDate:'',priority:'medium',status:'todo',desc:''};showModal(`<h3>${ie?'编辑待办':'新建待办'}</h3><div class="form-group"><label>标题</label><input type="text" id="task-title" value="${esc(t.title)}" placeholder="如：斗兽场抢票"></div><div class="form-group"><label>分类</label><select id="task-category">${TASK_CATS.map(c=>`<option value="${c}" ${t.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="form-group"><label>描述</label><textarea id="task-desc" placeholder="详细信息...">${esc(t.desc||'')}</textarea></div><div style="display:flex;gap:12px;"><div class="form-group" style="flex:1;"><label>负责人</label><select id="task-assignee">${MEMBERS.map(m=>`<option value="${m.id}" ${t.assignee===m.id?'selected':''}>${memberOptLabel(m)}</option>`).join('')}</select></div><div class="form-group" style="flex:1;"><label>截止日期</label><input type="date" id="task-due" value="${t.dueDate||''}"></div></div><div style="display:flex;gap:12px;"><div class="form-group" style="flex:1;"><label>优先级</label><select id="task-priority">${Object.entries(PRIO).map(([k,v])=>`<option value="${k}" ${t.priority===k?'selected':''}>${v.label}</option>`).join('')}</select></div><div class="form-group" style="flex:1;"><label>状态</label><select id="task-status">${TASK_COLS.map(c=>`<option value="${c.id}" ${t.status===c.id?'selected':''}>${c.label}</option>`).join('')}</select></div></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveTask(${ie?tid:'-1'})">保存</button></div>`)}
function saveTask(tid){const d={title:document.getElementById('task-title').value.trim(),category:document.getElementById('task-category').value,desc:document.getElementById('task-desc').value.trim(),assignee:parseInt(document.getElementById('task-assignee').value),dueDate:document.getElementById('task-due').value,priority:document.getElementById('task-priority').value,status:document.getElementById('task-status').value};if(!d.title){showToast('请填写标题');return}if(tid>=0){Object.assign(state.tasks.find(t=>t.id===tid),d);logActivity(`编辑了待办"${d.title}"`)}else{d.id=nextId(state.tasks);state.tasks.push(d);logActivity(`新建了待办"${d.title}"`)}saveState();closeModal();renderTasks(document.getElementById('content'));updateTaskBadge();showToast('保存成功')}
function deleteTask(id){const t=state.tasks.find(x=>x.id===id);state.tasks=state.tasks.filter(x=>x.id!==id);logActivity(`删除了待办"${t.title}"`);saveState();renderTasks(document.getElementById('content'));updateTaskBadge();showToast('已删除')}
function updateTaskBadge(){document.getElementById('task-badge').textContent=state.tasks.filter(t=>t.status!=='done').length}

   PACKING (行李准备)
   ================================================================ */
const PACKING_CATS = ['证件','衣物','电子','洗漱','药品','其他'];
const PACKING_CAT_ICONS = {证件:'📄',衣物:'👕',电子:'🔌',洗漱:'🪥',药品:'💊',其他:'🎒'};

function openPackingModal(editId) {
  const isEdit = editId!==undefined;
  const item = isEdit ? state.packing.find(p=>p.id===editId) : {category:'证件',item:'',note:'',assignee:0,checked:false,isShared:false};
  const isShared = item.isShared || false;
  const cats = PACKING_CATS.map(c=>`<option value="${c}" ${item.category===c?'selected':''}>${PACKING_CAT_ICONS[c]} ${c}</option>`).join('');
  const selShared = isShared?'selected':'';
  const mops = '<option value="-1" '+selShared+'>🔥 全员必带</option><option value="0">公用</option>' + MEMBERS.map(m=>`<option value="${m.id}" ${(!isShared&&item.assignee===m.id)?'selected':''}>${m.name}</option>`).join('');
  showModal(`<h3>${isEdit?'编辑行李项':'添加行李项'}</h3>
    <div class="form-group"><label>分类</label><select id="pk-cat">${cats}</select></div>
    <div class="form-group"><label>物品名称</label><input type="text" id="pk-item" value="${esc(item.item)}" placeholder="如：转换插头（意标）"></div>
    <div class="form-group"><label>备注</label><input type="text" id="pk-note" value="${esc(item.note||'')}" placeholder="如：三孔细脚"></div>
    <div class="form-group"><label>负责人</label><select id="pk-assignee">${mops}</select></div>
    ${isEdit&&isShared?`<div style="font-size:12px;color:#E8A92E;margin-bottom:8px;">⚠️ 此修改将同步到所有成员的副本</div>`:''}
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="savePackingItem(${isEdit?editId:-1})">保存</button>
    </div>`);
}

function savePackingItem(editId) {
  const assigneeVal = parseInt(document.getElementById('pk-assignee').value);
  const isShared = assigneeVal === -1;
  const data = {
    category: document.getElementById('pk-cat').value,
    item: document.getElementById('pk-item').value.trim(),
    note: document.getElementById('pk-note').value.trim(),
    assignee: isShared ? 0 : assigneeVal,
    checked: false,
    isShared: isShared,
    sharedGroup: isShared ? Date.now().toString(36) : undefined,
  };
  if(!data.item){showToast('请填写物品名称');return}
  if(editId>0){
    // Edit existing item
    const existing = state.packing.find(p=>p.id===editId);
    const wasShared = !!(existing && existing.sharedGroup);
    if(wasShared && isShared){
      // 共享→共享：更新所有组内成员的副本
      state.packing.forEach(p=>{
        if(p.sharedGroup===existing.sharedGroup){
          p.category = data.category;
          p.item = data.item;
          p.note = data.note;
        }
      });
      logActivity('更新了全员行李项"'+data.item+'"（已同步到所有成员）');
    } else if(wasShared && !isShared){
      // 共享→非共享：删除整组，创建单个
      state.packing = state.packing.filter(p=>p.sharedGroup!==existing.sharedGroup);
      const maxId = state.packing.reduce((m,p)=>Math.max(m,p.id),0);
      const newData = {...data, id:maxId+1, sharedGroup:undefined, isShared:false};
      delete newData.sharedGroup;
      state.packing.push(newData);
      logActivity('将全员行李项"'+data.item+'"改为'+(assigneeVal===0?'公用':getMember(assigneeVal)?.name||'个人')+'物品');
    } else if(!wasShared && isShared){
      // 非共享→全员必带：删除单个，创建6份副本
      const oldChecked = existing ? existing.checked : false;
      state.packing = state.packing.filter(p=>p.id!==editId);
      const maxId = state.packing.reduce((m,p)=>Math.max(m,p.id),0);
      const groupId = data.sharedGroup;
      MEMBERS.forEach((m,i)=>{
        state.packing.push({...data, assignee: m.id, sharedGroup: groupId, id: maxId+1+i, checked: oldChecked});
      });
      logActivity('将"'+data.item+'"改为全员必带（已同步到6人清单）');
    } else {
      // 非共享→非共享：直接更新
      const idx = state.packing.findIndex(p=>p.id===editId);
      if(idx>=0){ data.checked = state.packing[idx].checked; delete data.sharedGroup; state.packing[idx] = {...state.packing[idx], ...data}; logActivity('更新了行李项"'+data.item+'"'); }
    }
  } else {
    if(isShared){
      // Create 6 copies, one per member
      const maxId = state.packing.reduce((m,p)=>Math.max(m,p.id),0);
      const groupId = data.sharedGroup;
      MEMBERS.forEach((m,i)=>{
        state.packing.push({...data, assignee: m.id, sharedGroup: groupId, id: maxId+1+i});
      });
      logActivity('添加了全员必带"'+data.item+'"（已同步到6人清单）');
    } else {
      const maxId = state.packing.reduce((m,p)=>Math.max(m,p.id),0);
      state.packing.push({...data, id:maxId+1});
      logActivity('添加了行李项"'+data.item+'"');
    }
  }
  saveState(); closeModal(); renderPacking(document.getElementById('content'));
  updatePackingBadge(); showToast(isShared&&editId<0?'已添加到6人清单！':'保存成功');
}

function togglePackingItem(id) {
  const item = state.packing.find(p=>p.id===id);
  if(!item) return;
  item.checked = !item.checked;
  logActivity((item.checked?'勾选了':'取消勾选')+'行李项"'+item.item+'"');
  saveState(); updatePackingBadge();
  renderPacking(document.getElementById('content'));
}

function deletePackingItem(id) {
  const item = state.packing.find(p=>p.id===id);
  if(!item) return;
  if(item.sharedGroup){
    const count = state.packing.filter(p=>p.sharedGroup===item.sharedGroup).length;
    if(!confirm('删除共享项"'+item.item+'"？（将移除所有'+count+'位成员的副本）')) return;
    state.packing = state.packing.filter(p=>p.sharedGroup!==item.sharedGroup);
    logActivity('删除了全员行李项"'+item.item+'"');
  } else {
    if(!confirm('删除"'+item.item+'"？')) return;
    state.packing = state.packing.filter(p=>p.id!==id);
    logActivity('删除了行李项"'+item.item+'"');
  }
  saveState(); renderPacking(document.getElementById('content'));
  updatePackingBadge(); showToast('已删除');
}

function updatePackingBadge() {
  const checked = state.packing.filter(p=>p.checked).length;
  const total = state.packing.length;
  const badge = document.getElementById('packing-badge');
  if(!badge) return;
  badge.textContent = checked+'/'+total;
  badge.style.background = checked===total && total>0 ? '#4EA347' : '#A89B8C';
}

function renderPacking(el) {
  const filter = state.packingFilter || 'all';
  const sorted = [...state.packing].sort((a,b)=>{
    if(a.checked!==b.checked) return a.checked?1:-1;
    return PACKING_CATS.indexOf(a.category)-PACKING_CATS.indexOf(b.category);
  });
  let items = sorted.filter(p=>filter==='all'||p.assignee===filter);
  if(filter==='all'){
    const seenGroups = new Set();
    items = items.filter(p=>{
      if(!p.sharedGroup) return true;
      if(seenGroups.has(p.sharedGroup)) return false;
      seenGroups.add(p.sharedGroup);
      return true;
    });
  }
  const catGroups = {};
  items.forEach(p=>{
    if(!catGroups[p.category]) catGroups[p.category] = [];
    catGroups[p.category].push(p);
  });

  // Per-member progress
  let progressItems = filter==='all' ? [...state.packing] : state.packing.filter(p=>p.assignee===filter);
  const checkedTotal = progressItems.filter(p=>p.checked).length;
  const totalForProgress = progressItems.length;
  const progress = totalForProgress>0?Math.round(checkedTotal/totalForProgress*100):0;

  const mFilters = '<button class="btn '+(filter==='all'?'btn-primary':'btn-outline')+' btn-sm" onclick="state.packingFilter=\'all\';renderPacking(document.getElementById(\'content\'))">全部</button>' +
    MEMBERS.map(m=>`<button class="btn ${filter===m.id?'btn-primary':'btn-outline'} btn-sm" onclick="state.packingFilter=${m.id};renderPacking(document.getElementById('content'))" style="padding:4px 10px;">${m.name}</button>`).join('');

  el.innerHTML = `\x3cdiv style="margin-bottom:14px;"\x3e
      \x3cdiv style="display:flex;align-items:center;gap:12px;margin-bottom:8px;"\x3e
        \x3cspan style="font-weight:700;font-size:15px;"\x3e📊 准备进度：${checkedTotal}/${totalForProgress}（${progress}%）\x3c/span\x3e
      \x3c/div\x3e
      \x3cdiv class="progress-bar" style="height:8px;background:var(--c-border);border-radius:4px;overflow:hidden;"\x3e
        \x3cdiv style="height:100%;width:${progress}%;background:linear-gradient(90deg,#4EA347,#7ECF6A);border-radius:4px;transition:width .3s;"\x3e\x3c/div\x3e
      \x3c/div\x3e
    \x3c/div\x3e
    \x3cdiv style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;"\x3e${mFilters}\x3c/div\x3e
    \x3cdiv style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;"\x3e
      ${Object.keys(catGroups).map(cat=>`\x3cdiv class="card" style="padding:14px;"\x3e
          \x3cdiv style="font-weight:700;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px;"\x3e
            \x3cspan style="font-size:18px;"\x3e${PACKING_CAT_ICONS[cat]||'📦'}\x3c/span\x3e${cat}
            \x3cspan style="font-weight:400;color:var(--c-text-secondary);font-size:12px;margin-left:auto;"\x3e${catGroups[cat].filter(p=>p.checked).length}/${catGroups[cat].length}\x3c/span\x3e
          \x3c/div\x3e
          ${catGroups[cat].map(p=>{
            const m = p.assignee>0?MEMBERS.find(mb=>mb.id===p.assignee):null;
            const tag = (!p.sharedGroup && m)?`\x3cspan style="font-size:11px;background:${m.color}20;color:${m.color};padding:1px 6px;border-radius:8px;margin-left:6px;"\x3e${m.name}\x3c/span\x3e`:'';
            const sharedTag = p.sharedGroup?`\x3cspan style="font-size:11px;background:#FFF3CD;color:#B8560A;padding:1px 6px;border-radius:8px;margin-left:4px;"\x3e🔥全员必带\x3c/span\x3e`:(p.assignee===0?'\x3cspan style="font-size:11px;background:var(--c-surface-alt);color:var(--c-text-secondary);padding:1px 6px;border-radius:8px;margin-left:4px;"\x3e公用\x3c/span\x3e':'');
            const isOwner = state.currentUser === p.assignee || p.assignee === 0 || !!p.sharedGroup;
            const clickAttr = isOwner ? `onclick="togglePackingItem(${p.id})"` : '';
            const cursor = isOwner ? 'cursor:pointer' : 'cursor:default;opacity:0.6';
            const actions = isOwner ? `\x3cbutton class="btn btn-outline btn-sm" style="padding:2px 6px;font-size:11px;" onclick="event.stopPropagation();openPackingModal(${p.id})"\x3e✎\x3c/button\x3e
              \x3cbutton class="btn btn-outline btn-sm" style="padding:2px 6px;font-size:11px;color:#C5283D;" onclick="event.stopPropagation();deletePackingItem(${p.id})"\x3e×\x3c/button\x3e` : '';
            return `\x3cdiv class="packing-item${p.checked?' checked':''}" id="pk-${p.id}" style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--c-bg);${cursor};font-size:13px;" ${clickAttr}\x3e
              \x3cspan style="font-size:18px;flex-shrink:0;"\x3e${p.checked?'✅':'⬜'}\x3c/span\x3e
              \x3cspan style="flex:1;${p.checked?'text-decoration:line-through;color:var(--c-text-light);':''}"\x3e${esc(p.item)}${sharedTag}${p.note?`\x3cspan style="font-size:11px;color:var(--c-text-light);"\x3e · ${esc(p.note)}\x3c/span\x3e`:''}${tag}\x3c/span\x3e
              ${actions}
            \x3c/div\x3e`;
          }).join('')}
        \x3c/div\x3e
      `).join('')}
    \x3c/div\x3e
  `;
}

const EXP_CATS=['交通','住宿','门票','餐饮','购物','证件','保险','其他'];
function renderExpenses(el) {
  const pub = state.expenses.filter(e=>e.isShared), pri = state.expenses.filter(e=>!e.isShared);
  const totalCNY = state.expenses.reduce((s,e)=>s+toCNY(e.amount,e.currency),0);
  const totalAA = pub.reduce((s,e)=>s+toCNY(e.amount,e.currency),0);
  const perShare = totalAA/6;

  // per person breakdown
  const pp = {}; MEMBERS.forEach(m=>{ pp[m.id] = { aa:0, personal:0 } });
  pub.forEach(e=>{ const cny=toCNY(e.amount,e.currency); const share=cny/e.splitAmong.length; e.splitAmong.forEach(uid=>{ pp[uid].aa+=share }); });
  pri.forEach(e=>{ const cny=toCNY(e.amount,e.currency); pp[e.payerId].personal+=cny; });

  // category stats
  const cats={}; state.expenses.forEach(e=>{const cny=toCNY(e.amount,e.currency);cats[e.category]=(cats[e.category]||0)+cny});
  const colors={'交通':'#2E7D8F','住宿':'#D9622E','门票':'#7B5EA7','证件':'#E8A92E','保险':'#4A9D5B','餐饮':'#C5283D','购物':'#06B6D4','其他':'#A89B8C'};

  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <span style="font-size:11px;color:var(--c-text-light);">实时汇率</span>
      <span id="eur-rate-display" style="font-weight:700;color:var(--c-secondary);font-size:13px;background:var(--c-secondary-light);padding:2px 10px;border-radius:12px;">€1 = ¥${eurToCny}</span>
      <span style="font-size:10px;color:var(--c-text-light);">自动更新</span>
    </div>
    <div class="expense-summary">
      <div class="summary-box">
        <div class="sb-icon" style="background:linear-gradient(135deg,#FFF7ED,#FED7AA);">💰</div>
        <div class="sb-content"><div class="sb-value" style="color:var(--c-primary);">¥${totalCNY.toFixed(0)}</div><div class="sb-label">总消费</div><div class="sb-sub">${state.expenses.length} 笔记录</div></div>
      </div>
      <div class="summary-box">
        <div class="sb-icon" style="background:linear-gradient(135deg,#DCFCE7,#BBF7D0);">🏘️</div>
        <div class="sb-content"><div class="sb-value" style="color:#16A34A;">¥${totalAA.toFixed(0)}</div><div class="sb-label">公用费用</div><div class="sb-sub">人均 ¥${perShare.toFixed(0)} · ${pub.length} 笔</div></div>
      </div>
      <div class="summary-box">
        <div class="sb-icon" style="background:linear-gradient(135deg,#FEF3C7,#FDE68A);">👤</div>
        <div class="sb-content"><div class="sb-value" style="color:#D97706;">¥${(totalCNY-totalAA).toFixed(0)}</div><div class="sb-label">个人费用</div><div class="sb-sub">${pri.length} 笔个人消费</div></div>
      </div>
      <div class="summary-box">
        <div class="sb-icon" style="background:linear-gradient(135deg,#E0F2FE,#BAE6FD);">📝</div>
        <div class="sb-content"><div class="sb-value" style="color:var(--c-secondary);">${pub.length+pri.length}</div><div class="sb-label">记账笔数</div><div class="sb-sub">${pub.length} 公用 · ${pri.length} 个人</div></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-title">👤 人均明细</div>
      <div class="per-person-grid">
        ${MEMBERS.map(m=>{const p=pp[m.id];const t=p.aa+p.personal;const sharePct=totalCNY>0?(t/totalCNY*100).toFixed(0):0;const isCurrent=state.currentUser===m.id;return`<div class="per-person-card ${isCurrent?'current':''}"><div class="pp-avatar" style="background:${m.color}20;border:2px solid ${m.color};">${m.avatar}</div><div class="pp-name" style="color:${m.color};">${m.name}</div><div class="pp-row pp-aa"><span class="pp-label">AA</span><span class="pp-value">¥${p.aa.toFixed(0)}</span></div><div class="pp-row pp-personal"><span class="pp-label">个人</span><span class="pp-value">¥${p.personal.toFixed(0)}</span></div><div class="pp-total" style="color:${m.color};">¥${t.toFixed(0)}</div><div class="pp-share"><div class="pp-share-fill" style="width:${sharePct}%;background:${m.color};"></div></div><div style="font-size:10px;color:var(--c-text-light);margin-top:6px;">占总消费 ${sharePct}%</div></div>`}).join('')}
      </div>
    </div>

    <div class="grid-2" style="margin-bottom:16px;">
      <div class="card"><div class="card-title">📊 分类占比</div>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>{const pct=(amt/totalCNY*100).toFixed(0);return`<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:13px;"><span>${cat}</span><span style="font-weight:600;">¥${amt.toFixed(0)} · ${pct}%</span></div><div class="category-bar"><div class="category-bar-fill" style="width:${pct}%;background:${colors[cat]||'#A89B8C'};"></div></div></div>`}).join('')||'<div class="empty-state">暂无数据</div>'}</div>
      <div class="card"><div class="card-title">💡 费用说明</div><div style="font-size:13px;color:var(--c-text-secondary);line-height:1.8;">• <strong style="color:#16A34A;">公用费用</strong>：所有人AA分摊，如住宿、门票、交通<br>• <strong style="color:#D97706;">个人费用</strong>：个人自付，如购物、个人物品<br>• 每人总支出 = AA分摊金额 + 个人消费金额<br>• 记账时请选择"公用"或"个人"</div></div>
    </div>

    <div class="card"><div class="card-title">📝 消费明细</div>
      <div style="overflow-x:auto;"><table class="expense-table"><thead><tr><th>日期</th><th>项目</th><th>分类</th><th>类型</th><th>金额</th><th>付款人</th><th>分摊</th><th>备注</th><th></th></tr></thead><tbody>
        ${state.expenses.length===0?'<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--c-text-light);">暂无消费记录，点击右上角"记一笔账"开始</td></tr>':state.expenses.sort((a,b)=>new Date(a.date)-new Date(b.date)).map(e=>{const m=getMember(e.payerId),cny=toCNY(e.amount,e.currency);return`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.item)}</td><td><span class="tag" style="background:var(--c-surface-alt);color:var(--c-text-secondary);">${e.category}</span></td><td><span class="shared-badge ${e.isShared?'public':'private'}">${e.isShared?'公用':'个人'}</span></td><td class="amt ${e.currency==='EUR'?'amt-eur':'amt-cny'}">${e.currency==='EUR'?'€':'¥'}${e.amount}</td><td><span style="color:${m.color};font-weight:600;">${m.avatar} ${m.name}</span></td><td style="font-size:12px;">${e.isShared?e.splitAmong.map(uid=>getMember(uid).avatar).join('')+' (¥'+(cny/e.splitAmong.length).toFixed(0)+'/人)':'个人自付'}</td><td style="font-size:12px;color:var(--c-text-secondary);">${esc(e.note||'')}</td><td><button class="btn btn-outline btn-xs" onclick="openExpenseModal(${e.id})">编辑</button> <button class="btn btn-outline btn-xs" onclick="deleteExpense(${e.id})">删除</button></td></tr>`}).join('')}
      </tbody></table></div>
    </div>`;
}

function openExpenseModal(eid){const ie=eid!==undefined;const e=ie?state.expenses.find(x=>x.id===eid):{item:'',amount:0,currency:'CNY',payerId:state.currentUser,category:'交通',isShared:true,splitAmong:[1,2,3,4,5,6],date:fmtDateFull(new Date()),note:''};showModal(`<h3>${ie?'编辑账目':'记一笔账'}</h3><div class="form-group"><label>项目名称</label><input type="text" id="exp-item" value="${esc(e.item)}" placeholder="如：斗兽场门票"></div><div style="display:flex;gap:12px;"><div class="form-group" style="flex:1;"><label>金额</label><input type="number" step="0.01" id="exp-amount" value="${e.amount}"></div><div class="form-group" style="width:100px;"><label>币种</label><select id="exp-currency"><option value="CNY" ${e.currency==='CNY'?'selected':''}>¥ CNY</option><option value="EUR" ${e.currency==='EUR'?'selected':''}>€ EUR</option></select></div></div><div style="display:flex;gap:12px;"><div class="form-group" style="flex:1;"><label>分类</label><select id="exp-category">${EXP_CATS.map(c=>`<option value="${c}" ${e.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="form-group" style="flex:1;"><label>日期</label><input type="date" id="exp-date" value="${e.date}"></div></div><div class="form-group"><label>付款人</label><select id="exp-payer">${MEMBERS.map(m=>`<option value="${m.id}" ${e.payerId===m.id?'selected':''}>${memberOptLabel(m)}</option>`).join('')}</select></div><div class="form-group"><label>费用类型</label><div style="display:flex;gap:10px;"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:10px 16px;border:2px solid ${e.isShared?'#16A34A':'var(--c-border)'};border-radius:8px;flex:1;background:${e.isShared?'#DCFCE7':'var(--c-surface)'};"><input type="radio" name="exp-shared" value="1" ${e.isShared?'checked':''} onchange="toggleExpSplit()"> 🏘️ 公用（AA分摊）</label><label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:10px 16px;border:2px solid ${!e.isShared?'#D97706':'var(--c-border)'};border-radius:8px;flex:1;background:${!e.isShared?'#FEF3C7':'var(--c-surface)'};"><input type="radio" name="exp-shared" value="0" ${!e.isShared?'checked':''} onchange="toggleExpSplit()"> 👤 个人</label></div></div><div id="exp-split-group"><div class="form-group"><label>分摊给（多选）</label><div style="display:flex;gap:8px;flex-wrap:wrap;padding:8px;border:1.5px solid var(--c-border);border-radius:8px;">${MEMBERS.map(m=>`<label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;"><input type="checkbox" value="${m.id}" ${e.splitAmong.includes(m.id)?'checked':''}> ${m.avatar} ${m.name}</label>`).join('')}</div></div></div><div class="form-group"><label>备注</label><input type="text" id="exp-note" value="${esc(e.note||'')}" placeholder="可选"></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveExpense(${ie?eid:'-1'})">保存</button></div>`);if(!e.isShared)document.getElementById('exp-split-group').style.display='none'}
function toggleExpSplit(){const shared=document.querySelector('input[name="exp-shared"]:checked').value==='1';document.getElementById('exp-split-group').style.display=shared?'block':'none'}
function saveExpense(eid){const isShared=document.querySelector('input[name="exp-shared"]:checked').value==='1';const splitAmong=isShared?[...document.querySelectorAll('#modal input[type=checkbox]:checked')].map(cb=>parseInt(cb.value)):[];if(isShared&&splitAmong.length===0){showToast('请选择至少一人分摊');return}const d={item:document.getElementById('exp-item').value.trim(),amount:parseFloat(document.getElementById('exp-amount').value)||0,currency:document.getElementById('exp-currency').value,category:document.getElementById('exp-category').value,date:document.getElementById('exp-date').value,payerId:parseInt(document.getElementById('exp-payer').value),isShared,splitAmong:isShared?splitAmong:[],note:document.getElementById('exp-note').value.trim()};if(!d.item||d.amount<=0){showToast('请填写项目和金额');return}if(eid>=0){Object.assign(state.expenses.find(e=>e.id===eid),d);logActivity(`编辑了账目"${d.item}"`)}else{d.id=nextId(state.expenses);state.expenses.push(d);logActivity(`记录了${d.isShared?'公用':'个人'}消费"${d.item}"`)}saveState();closeModal();renderExpenses(document.getElementById('content'));showToast('保存成功')}
function deleteExpense(id){const e=state.expenses.find(x=>x.id===id);state.expenses=state.expenses.filter(x=>x.id!==id);logActivity(`删除了账目"${e.item}"`);saveState();renderExpenses(document.getElementById('content'));showToast('已删除')}

let lightboxImages = [], lightboxIdx = 0;

function openLightbox(dayId, actIdx, imgIdx) {
  const day = state.itinerary.find(d => d.id === dayId);

function showLightboxImage() {
  const img = document.getElementById('lightbox-img');
  const counter = document.getElementById('lightbox-counter');
  const imgId = lightboxImages[lightboxIdx];
  img.alt = '加载中...';
  imgDB.load(imgId).then(b64 => {

  }).catch(() => { img.alt = '图片加载失败'; });

  document.querySelector('.lightbox-nav.next').style.display = lightboxImages.length > 1 ? 'flex' : 'none';
}

function lightboxNav(dir) {
  lightboxIdx = (lightboxIdx + dir + lightboxImages.length) % lightboxImages.length;
  showLightboxImage();
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

// Keyboard navigation for lightbox
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('lightbox').classList.contains('show')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lightboxNav(-1);

/* ================================================================
   SUPABASE REAL-TIME SYNC
   ================================================================ */
let supabaseClient = null, supabaseChannel = null, tripRowId = null, lastSupabaseVersion = -1, lastBroadcast = '', syncStatus = 'offline';

function initSupabase() {
  const url = localStorage.getItem('supabase-url');
  const key = localStorage.getItem('supabase-key');
  if (!url || !key) {
    syncStatus = 'offline';
    updateSyncIndicator();
    setupSupabaseConfig();
    return;
  }

  updateSyncIndicator('connecting');
  supabaseClient = supabase.createClient(url, key);

  supabaseClient.from('trip_state').select('*').limit(1).maybeSingle()
    .then(({ data, error }) => {
      if (error) { console.log('⚠️ Supabase 查询失败:', error.message); syncStatus = 'offline'; updateSyncIndicator(); return; }
      if (data) {
        tripRowId = data.id;
        if (data.state && data.state.data) {
          lastSupabaseVersion = data.state.version || 0;
          applyIncomingState({ ...data.state.data, version: data.state.version, lastModifiedBy: data.state.updated_by });
          console.log('📥 从 Supabase 加载数据 (v' + (data.state.version || 0) + ')');
        } else {
          console.log('📤 上传本地数据到 Supabase (已有行)');
          pushToSupabase();
        }
      } else {
        console.log('📤 首次上传数据到 Supabase');
        pushToSupabase();
      }
      syncStatus = 'online';
      updateSyncIndicator();
      // Subscribe to realtime changes
      setupRealtimeChannel();
    });
}

function setupRealtimeChannel() {
  if (supabaseChannel) supabaseClient.removeChannel(supabaseChannel);
  supabaseChannel = supabaseClient
    .channel('trip_state_changes')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'trip_state' },
      (payload) => {
        const row = payload.new || payload.old;
        if (!row || !row.state) return;
        if (row.state.version > lastSupabaseVersion) {
          lastSupabaseVersion = row.state.version;
          applyIncomingState({ ...row.state.data, version: row.state.version, lastModifiedBy: row.state.updated_by });
          console.log('⚡ 实时同步 (v' + row.state.version + ') ← ' + row.state.updated_by);
        }
      }
    )
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        syncStatus = 'online';
        updateSyncIndicator();
      }
    });
}

function connectToSupabase(url, key) {
  localStorage.setItem('supabase-url', url);
  localStorage.setItem('supabase-key', key);
  if (supabaseChannel) supabaseClient.removeChannel(supabaseChannel);
  initSupabase();
}

function updateSyncIndicator(status) {
  const el = document.getElementById('sync-indicator');
  if (!el) return;
  const s = status || syncStatus;
  if (s === 'online') {
    el.innerHTML = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#4A9D5B;margin-right:4px;"></span> ☁️ Supabase 实时同步';
    el.style.color = '#4A9D5B';
  } else if (s === 'connecting') {
    el.innerHTML = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#E8A92E;margin-right:4px;"></span> 连接中...';
    el.style.color = '#E8A92E';
  } else {
    el.innerHTML = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#A89B8C;margin-right:4px;"></span> 未配置同步 · 点击设置';
    el.style.color = '#A89B8C';
  }
}

  const key = localStorage.getItem('supabase-key') || '';
  showModal(`<h3>⚙️ 配置 Supabase 实时同步</h3>

function saveSupabaseConfig() {
  const url = document.getElementById('supa-url').value.trim();

function pushToSupabase() {
  if (!supabaseClient) return;
  const m = getMember(state.currentUser);
  const d = {
    tasks: state.tasks, expenses: state.expenses, packing: state.packing,
    activities: state.activities, itinerary: state.itinerary,
    expandedDays: [...state.expandedDays]
  };
  const sig = JSON.stringify(d);
  if (sig === lastBroadcast) return;
  const newVersion = lastSupabaseVersion + 1;
  const payload = { state: { data: d, version: newVersion, updated_by: m ? m.name : '有人' }, updated_at: new Date().toISOString() };

  const op = tripRowId
    ? supabaseClient.from('trip_state').update(payload).eq('id', tripRowId)
    : supabaseClient.from('trip_state').insert(payload).select('id').single();

  op.then(({ data: result, error }) => {
    if (!error) {
      if (!tripRowId && result) tripRowId = result.id;
      lastSupabaseVersion = newVersion; lastBroadcast = sig; updateSyncIndicator('online');
      console.log('✅ 数据已同步到 Supabase (v' + newVersion + ')');
    } else {
      console.log('⚠️ pushToSupabase 失败:', error.message);
    }
  }).catch(err => { console.log('pushToSupabase error:', err); });
}

function applyIncomingState(data) {
  if (!data) return;

  if (data.tasks) state.tasks = data.tasks;
  if (data.expenses) state.expenses = data.expenses;
  if (data.packing) state.packing = data.packing;
  if (data.activities) state.activities = data.activities;
  if (data.itinerary) state.itinerary = data.itinerary;
  // Keep structural city names in sync with code defaults
  state.itinerary.forEach((day, i) => {
    if (INITIAL_ITINERARY[i] && INITIAL_ITINERARY[i].city) {
      day.city = INITIAL_ITINERARY[i].city;
    }
  });
  // Migration: force-update Day 10 & 11 itinerary (Oct 5-6 Florence/Rome revised schedule)
  // Signature-based: re-runs whenever stale data arrives (initial fetch / realtime)
  const migratedD10D11 = migrateItineraryD10D11();
  if (data.expandedDays) state.expandedDays = new Set(data.expandedDays);
  lastSupabaseVersion = data.version || lastSupabaseVersion;

  // Save the migrated state (not raw data) to localStorage
  persistState();
  // If migration ran, push corrected itinerary back to Supabase
  if (migratedD10D11) pushToSupabase();

  const v = state.currentView, el = document.getElementById('content');
  if (v !== 'map') {
    switch(v) {
      case 'dashboard': renderDashboard(el); break;
      case 'itinerary': renderItinerary(el); break;
      case 'tasks': renderTasks(el); break;
      case 'packing': renderPacking(el); break;
      case 'expenses': renderExpenses(el); break;
      case 'members': renderMembers(el); break;
      case 'activity': renderActivityLog(el); break;
    }
  }
  updateTaskBadge();
  updatePackingBadge();
}

    if (data.rates && data.rates.CNY) {
      eurToCny = Math.round(data.rates.CNY * 100) / 100;

      if (el) el.textContent = eurToCny;
      const contentEl = document.getElementById('content');

        switch (state.currentView) {
          case 'dashboard': renderDashboard(contentEl); break;
          case 'expenses': renderExpenses(contentEl); break;
        }
      }
    }
  } catch(e) {
    console.log('汇率获取失败，使用默认汇率 ¥' + eurToCny);
  }
}
